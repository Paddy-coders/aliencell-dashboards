<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aliencell 数据看板中心</title>
<style>
  :root {
    --bg:#f5f7fa; --card:#ffffff; --border:#e5e9f0; --text:#1f2733; --muted:#6b7688;
    --primary:#2563eb; --primary-soft:#eef4ff; --shadow:0 1px 3px rgba(16,24,40,.08);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); overflow:hidden;
  }
  .app { display:flex; height:100vh; }

  /* ---- 左侧导航 ---- */
  .sidebar {
    width:238px; min-width:238px; background:var(--card); border-right:1px solid var(--border);
    display:flex; flex-direction:column; z-index:10;
  }
  .brand { padding:20px 18px 16px; border-bottom:1px solid var(--border); }
  .brand .logo {
    display:flex; align-items:center; gap:9px; font-size:16px; font-weight:700; color:var(--text);
  }
  .brand .logo-dot {
    width:26px; height:26px; border-radius:8px; background:linear-gradient(135deg,#2563eb,#7c3aed);
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:13px; font-weight:700;
  }
  .brand .sub { font-size:11px; color:var(--muted); margin-top:6px; line-height:1.5; }

  .nav { flex:1; padding:12px 10px; overflow-y:auto; }
  .nav-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; padding:4px 8px 8px; }
  .nav-item {
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    padding:10px 12px; margin-bottom:4px; border:none; background:transparent; cursor:pointer;
    border-radius:9px; transition:background .15s, box-shadow .15s;
  }
  .nav-item:hover { background:#f0f4fb; }
  .nav-item.active { background:var(--primary-soft); box-shadow:inset 0 0 0 1px rgba(37,99,235,.18); }
  .nav-item .icon {
    width:30px; height:30px; min-width:30px; border-radius:8px;
    display:flex; align-items:center; justify-content:center; font-size:14px;
    background:#eef1f6; color:#4a5568;
  }
  .nav-item.active .icon { background:#dbeafe; color:var(--primary); }
  .nav-item .t { font-size:13px; font-weight:600; color:var(--text); line-height:1.3; }
  .nav-item .d { font-size:11px; color:var(--muted); margin-top:2px; line-height:1.4; }

  .sidebar-foot { padding:12px 16px; border-top:1px solid var(--border); font-size:11px; color:var(--muted); line-height:1.6; }
  .sidebar-foot b { color:var(--text); font-weight:600; }

  /* ---- 右侧内容 ---- */
  .content { flex:1; position:relative; background:var(--bg); display:flex; flex-direction:column; min-width:0; }
  #frame { flex:1; min-height:0; width:100%; border:none; display:block; }
  .frame-loading {
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--bg); gap:12px; transition:opacity .25s; z-index:5;
  }
  .frame-loading.hide { opacity:0; pointer-events:none; }
  .spinner {
    width:30px; height:30px; border-radius:50%;
    border:3px solid var(--border); border-top-color:var(--primary);
    animation:spin .8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .frame-loading span { font-size:13px; color:var(--muted); }

  /* ---- 左侧导航底部：产品映射区块 ---- */
  .nav-map { border-top:1px solid var(--border); margin-top:8px; padding-top:8px; }
  .map-btn {
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    padding:8px 12px; margin-bottom:4px; border:none; background:transparent; cursor:pointer;
    border-radius:9px; font-size:12.5px; font-weight:600; color:var(--text); transition:background .15s;
  }
  .map-btn:hover { background:#f0f4fb; }
  /* 未维护成本依据的红色感叹号（2026-10-21）：数据来自 mapping.data.unmapped */
  .map-alert {
    display:none; margin-left:auto; min-width:18px; height:18px; padding:0 5px;
    border-radius:9px; background:#E24B4A; color:#fff; font-size:12px; font-weight:700;
    line-height:18px; text-align:center; box-shadow:0 0 0 2px #fff;
  }
  .map-btn .mi {
    width:26px; height:26px; min-width:26px; border-radius:7px;
    display:flex; align-items:center; justify-content:center; font-size:13px; background:#eef1f6; color:#4a5568;
  }
  .map-status { font-size:11px; color:var(--muted); padding:2px 12px 8px; line-height:1.5; }
  .map-status b { color:var(--primary); }
  .btn-back {
    margin:2px 0 4px; padding:8px 12px; width:100%; text-align:left;
    font-size:12.5px; font-weight:600; color:var(--primary);
    background:var(--primary-soft); border:1px solid rgba(37,99,235,.3); border-radius:9px; cursor:pointer;
    display:flex; align-items:center; gap:8px;
  }
  .btn-back:hover { background:#e0ebff; }

  /* ---- 用户信息 + 退出 ---- */
  .user-box { padding:10px 14px; border-top:1px solid var(--border); display:flex; align-items:center; gap:8px; }
  .user-info { flex:1; min-width:0; }
  .user-email { font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .user-role { display:inline-block; font-size:10px; padding:1px 7px; border-radius:5px; font-weight:600; margin-top:2px; }
  .user-role.admin { background:#dbeafe; color:#1d4ed8; }
  .user-role.viewer { background:#f0f1f3; color:#6b7688; }
  .btn-logout { border:1px solid var(--border); background:#fff; color:var(--muted); padding:4px 12px; border-radius:7px; font-size:12px; cursor:pointer; transition:all .15s; white-space:nowrap; }
  .btn-logout:hover { border-color:var(--danger); color:var(--danger); }

  /* ---- 移动端：导航收成顶部 ---- */
  @media (max-width:760px) {
    .app { flex-direction:column; }
    .sidebar { width:100%; min-width:0; border-right:none; border-bottom:1px solid var(--border); }
    .brand { padding:12px 16px; }
    .brand .sub { display:none; }
    .nav { display:flex; flex-wrap:wrap; padding:8px; gap:6px; }
    .nav-label { display:none; }
    .nav-item { flex:1; min-width:90px; padding:8px 10px; }
    .nav-item .d { display:none; }
    .sidebar-foot { display:none; }
    .nav-map { width:100%; border-top:none; margin-top:2px; padding-top:2px; display:flex; gap:6px; flex-wrap:wrap; }
    .nav-map .map-btn { flex:1; min-width:120px; }
    .map-status { width:100%; }
    .btn-back { width:100%; }
  }
</style>
</head>
<body>
<script>
  // === 认证守卫：在页面渲染前检查登录状态 ===
  var AUTH = null;
  try { AUTH = JSON.parse(localStorage.getItem('wb_auth') || 'null'); } catch (e) {}
  if (!AUTH || !AUTH.access_token) { location.replace('login.html'); }
</script>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="logo-dot">A</span>Aliencell 数据看板</div>
      <div class="sub">易仓ERP · 周维度(周六-周五) · 每日15:00刷新</div>
    </div>
    <nav class="nav">
      <div class="nav-label">看板导航</div>
      <button class="nav-item" data-id="ad" onclick="switchTab('ad')">
        <span class="icon">📊</span>
        <span><span class="t">广告周度分析</span><br><span class="d">SP/SD/SB · 13国 · 视频指标 · 趋势图</span></span>
      </button>
      <button class="nav-item" data-id="product" onclick="switchTab('product')">
        <span class="icon">📈</span>
        <span><span class="t">周度汇总数据</span><br><span class="d">产品报告+广告 · 周六-周五周维度</span></span>
      </button>
      <button class="nav-item" data-id="daily" onclick="switchTab('daily')">
        <span class="icon">📅</span>
        <span><span class="t">每日数据</span><br><span class="d">业务报告+广告 · 北京时间 · 环比</span></span>
      </button>
      <button class="nav-item" data-id="monthly" onclick="switchTab('monthly')">
        <span class="icon">🗓️</span>
        <span><span class="t">月度数据</span><br><span class="d">自然月维度 · 与周度汇总同口径</span></span>
      </button>
      <button class="nav-item" data-id="target" onclick="switchTab('target')">
        <span class="icon">🎯</span>
        <span><span class="t">月度目标追踪</span><br><span class="d">目标 vs 实际 · 进度/差距/预测</span></span>
      </button>
      <!-- JoyBuy 独立业务线：与亚马逊看板分开迭代，共用同一入口与登录 -->
      <div class="nav-label" style="padding-top:12px">JoyBuy</div>
      <button class="nav-item" data-id="joybuy" onclick="switchTab('joybuy')">
        <span class="icon">🛍️</span>
        <span><span class="t">JoyBuy 数据看板</span><br><span class="d">订单/销售周度 · 流量 · 加购 · 收藏</span></span>
      </button>
      <!-- 产品关系管理（看板导航最下面） -->
      <div class="nav-map">
        <div class="nav-label" style="padding-top:10px">产品关系</div>
        <button class="map-btn" onclick="openMapping()"><span class="mi">🔗</span>产品关系管理<span class="map-alert" id="mapAlert" title=""></span></button>
        <button class="map-btn" onclick="openWoot()"><span class="mi">🛒</span>Woot 数据管理</button>
        <button class="map-btn" onclick="openFinance()"><span class="mi">🧾</span>财务录入（其他渠道/测评费）</button>
        <div class="map-status" id="mapStatus">映射 <b>0</b> ASIN · <b>0</b> 系列</div>
        <button class="btn-back" id="btnBack" onclick="backFromMapping()" style="display:none">◀ 返回看板</button>
        <!-- 用户管理（仅管理员可见） -->
        <button class="map-btn" id="btnAdminUsers" onclick="openAdminUsers()" style="display:none;margin-top:6px"><span class="mi">👥</span>用户管理</button>
      </div>
    </nav>
    <div class="user-box" id="userBox" style="display:none">
      <div class="user-info">
        <div class="user-email" id="userEmail"></div>
        <span class="user-role admin" id="userRole"></span>
      </div>
      <button class="btn-logout" onclick="doLogout()" title="退出登录">退出</button>
    </div>
    <div class="sidebar-foot">
      数据更新：<b>每周一 15:00 / 每日 15:00</b><br>
      打开链接即最新数据
    </div>
  </aside>
  <main class="content">
    <div class="frame-loading" id="loading"><div class="spinner"></div><span>加载中…</span></div>
    <iframe id="frame" title="看板内容"></iframe>
  </main>
</div>

<script>
  // === Supabase 认证常量 ===
  var SUPABASE_URL = 'https://oovvqvgrjqwogjwswaxx.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_OOmvEVK2RnetfT_tWKHGgA_epmNnz0s';

  // 认证守卫已在 <body> 顶部执行；若未登录则不会执行到这里
  if (AUTH && AUTH.access_token) {

  var TABS = { ad: 'ad.html', product: 'product.html', daily: 'daily.html', monthly: 'monthly.html', target: 'target.html', joybuy: 'joybuy.html' };
  var ORDER = ['ad', 'product', 'daily', 'monthly', 'target', 'joybuy'];
  var curTab = 'ad', lastTab = 'ad', inMapping = false;

  // ---- 用户信息 UI ----
  (function () {
    var box = document.getElementById('userBox');
    var emailEl = document.getElementById('userEmail');
    var roleEl = document.getElementById('userRole');
    if (!box || !emailEl) return;
    emailEl.textContent = (AUTH.user && AUTH.user.email) || '未知用户';
    var role = AUTH.role || 'viewer';
    roleEl.textContent = role === 'admin' ? '管理员' : '访客';
    roleEl.className = 'user-role ' + role;
    box.style.display = 'flex';
    // 产品映射管理对全体登录用户开放；用户管理入口仅管理员可见
    var adminBtn = document.getElementById('btnAdminUsers');
    if (adminBtn) adminBtn.style.display = role === 'admin' ? '' : 'none';
  })();

  // ---- 退出登录 ----
  function doLogout() {
    fetch(SUPABASE_URL + '/auth/v1/logout', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + AUTH.access_token }
    }).catch(function () {}).then(function () {
      try { localStorage.removeItem('wb_auth'); } catch (e) {}
      location.href = 'login.html?reason=logout';
    });
  }

  // ---- 异步校验 token 有效性（后台静默执行）----
  (function () {
    fetch(SUPABASE_URL + '/auth/v1/user', {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + AUTH.access_token }
    })
    .then(function (res) {
      if (res.status === 401 && AUTH.refresh_token) {
        // Token 过期，尝试刷新
        return fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
          method: 'POST',
          headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({ refresh_token: AUTH.refresh_token })
        })
        .then(function (r) { return r.json(); })
        .then(function (body) {
          if (body && body.access_token) {
            AUTH.access_token = body.access_token;
            AUTH.refresh_token = body.refresh_token || AUTH.refresh_token;
            AUTH.expires_at = Date.now() + (body.expires_in || 3600) * 1000;
            try { localStorage.setItem('wb_auth', JSON.stringify(AUTH)); } catch (e) {}
          } else {
            throw new Error('refresh failed');
          }
        });
      } else if (res.status !== 200) {
        throw new Error('token invalid');
      }
    })
    .catch(function () {
      try { localStorage.removeItem('wb_auth'); } catch (e) {}
      location.replace('login.html?reason=invalid');
    });
  })();

  // 缓存破环: 按小时生成版本号, 保证每次数据更新(每天15:00/周一15:00)后打开的是新版本
  function cacheBust() {
    return '?v=' + Math.floor(Date.now() / 3600000);
  }

  function switchTab(id, updateHash) {
    if (!TABS[id]) id = 'ad';
    var frame = document.getElementById('frame');
    frame.src = TABS[id] + cacheBust();
    var items = document.querySelectorAll('.nav-item');
    for (var i = 0; i < items.length; i++) {
      items[i].classList.toggle('active', items[i].getAttribute('data-id') === id);
    }
    curTab = id; inMapping = false;
    document.getElementById('btnBack').style.display = 'none';
    if (updateHash !== false) {
      try { history.replaceState(null, '', '#' + id); } catch (e) {}
    }
  }

  // 打开产品映射管理页（在 iframe 内加载 mapping.html；全体登录用户可用）
  function openMapping(tab) {
    lastTab = curTab;
    inMapping = true;
    document.getElementById('frame').src = 'mapping.html' + cacheBust() + (tab ? '#' + tab : '');
    var items = document.querySelectorAll('.nav-item');
    for (var i = 0; i < items.length; i++) items[i].classList.remove('active');
    document.getElementById('btnBack').style.display = '';
  }
  function backFromMapping() {
    switchTab(lastTab, true);
  }

  // 打开用户管理页（仅管理员；后端函数会二次校验角色）
  function openAdminUsers() {
    lastTab = curTab;
    inMapping = true;
    document.getElementById('frame').src = 'admin_users.html';
    var items = document.querySelectorAll('.nav-item');
    for (var i = 0; i < items.length; i++) items[i].classList.remove('active');
    document.getElementById('btnBack').style.display = '';
  }

  // 打开 Woot 数据管理页（上传 Woot 店铺活动销售/广告数据，并入三看板 US）
  function openWoot() {
    lastTab = curTab;
    inMapping = true;
    document.getElementById('frame').src = 'woot.html' + cacheBust();
    var items = document.querySelectorAll('.nav-item');
    for (var i = 0; i < items.length; i++) items[i].classList.remove('active');
    document.getElementById('btnBack').style.display = '';
  }

  // 打开财务录入页（其他渠道订单 / 测评费用；写云端 mapping.data.finance）
  function openFinance(tab) {
    lastTab = curTab;
    inMapping = true;
    document.getElementById('frame').src = 'finance_inputs.html' + cacheBust() + (tab ? '#' + tab : '');
    var items = document.querySelectorAll('.nav-item');
    for (var i = 0; i < items.length; i++) items[i].classList.remove('active');
    document.getElementById('btnBack').style.display = '';
  }

  // iframe 内部页面通过 postMessage 通知壳页面
  window.addEventListener('message', function (e) {
    if (!e.data || typeof e.data !== 'object') return;
    if (e.data.type === 'wb-nav-back') backFromMapping();
    else if (e.data.type === 'wb-map-changed') { refreshMapStatus(); refreshUnmappedBadge(); }
  });

  // 底部映射状态角标（读取 localStorage 实时统计）
  function refreshMapStatus() {
    var s = document.getElementById('mapStatus');
    if (!s) return;
    var asin = 0, series = 0;
    try {
      var a = JSON.parse(localStorage.getItem('pc_asinmap') || '[]');
      asin = Array.isArray(a) ? a.length : 0;
    } catch (e) {}
    try {
      var c = JSON.parse(localStorage.getItem('pc_catalog') || '[]');
      var set = new Set();
      (Array.isArray(c) ? c : []).forEach(function (x) { if (x && x.series) set.add(x.series); });
      series = set.size;
    } catch (e) {}
    s.innerHTML = '映射 <b>' + asin + '</b> ASIN · <b>' + series + '</b> 系列';
  }
  window.addEventListener('storage', refreshMapStatus);
  refreshMapStatus();

  // ---- 未维护成本依据：产品关系管理入口的红色感叹号（2026-10-21）----
  // 数据源 mapping.data.unmapped（每次抓数后由 sync_unmapped.py 写入），
  // 与页面里同一套判据：映射里没有该 ASIN，或映射到的产品名不在 costTable 里。
  function refreshUnmappedBadge() {
    fetch(SUPABASE_URL + '/rest/v1/mapping?select=data&id=eq.1', {
      headers: {'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY},
      cache: 'no-store'
    }).then(function (r) { return r.ok ? r.json() : null; }).then(function (rows) {
      var d = rows && rows[0] && rows[0].data;
      if (!d) return;
      var rep = d.unmapped;
      var el = document.getElementById('mapAlert');
      if (!el) return;
      if (!rep || !Array.isArray(rep.items)) { el.style.display = 'none'; return; }
      var costNames = new Set(Object.keys(((d.costTable || {}).products) || {}));
      var map = {};
      (Array.isArray(d.asinMap) ? d.asinMap : []).forEach(function (x) {
        if (x && x.asin) map[String(x.asin).toUpperCase()] = x;
      });
      var left = rep.items.filter(function (it) {
        var m = map[String(it.asin || '').toUpperCase()];
        if (!m) return true;
        return !costNames.has(m.name);
      });
      if (left.length) {
        el.textContent = '!';
        el.style.display = 'inline-block';   // CSS 默认 none，这里必须显式给值
        el.title = left.length + ' 个 ASIN 有销量但没维护成本依据（这部分毛利偏高）· 点击进入处理';
      } else {
        el.style.display = 'none';
      }
    }).catch(function () {});
  }
  refreshUnmappedBadge();
  setInterval(refreshUnmappedBadge, 60000);

  // 初始加载：支持 #ad / #product / #daily / #joybuy 直达，默认广告看板（与旧链接行为一致）
  // hash 容错：`#joybuy`、`#joybuy&x=1`、`#joybuy?x=1` 都能识别（取第一段）
  var initial = (location.hash || '').replace(/^#/, '').split(/[&?]/)[0];
  if (!TABS[initial]) initial = 'ad';
  switchTab(initial, false);

  // iframe 加载完成隐藏 loading
  var frame = document.getElementById('frame');
  var loading = document.getElementById('loading');
  frame.addEventListener('load', function () {
    loading.classList.add('hide');
  });

  } // end if (AUTH && AUTH.access_token)
</script>
</body>
</html>
